[package]
name = "qimen-mcp"
description = "Qimen Dunjia MCP server using the official Rust MCP SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap.workspace = true
qimen-calendar = { path = "../../crates/qimen-calendar", version = "0.2.0", features = ["schema"] }
qimen-core = { path = "../../crates/qimen-core", version = "0.2.0", features = ["schema"] }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { workspace = true, features = ["process"] }
tokio-util = "0.7"

[lints]
workspace = true
